services:
  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-/}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ferreterianuevo}
      DB_USER: ${DB_USER:-ferreteria_app}
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - profile-uploads:/var/www/html/public/uploads/perfiles

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ferreterianuevo}
      MARIADB_USER: ${DB_USER:-ferreteria_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/mysql
      - ./BD_FERRETERIA.sql:/docker-entrypoint-initdb.d/001-ferreteria.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  database-data:
  profile-uploads:
